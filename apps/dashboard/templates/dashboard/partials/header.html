<header class="dash-header"><button class="btn icon-btn" data-sidebar-toggle><i class="bi bi-list"></i></button><div><h1>{{ page_title }}</h1><p>إدارة بيانات المنصة من مصدرها الحقيقي</p></div><form class="global-search" action="{% url 'dashboard:global_search' %}" method="get"><label class="visually-hidden" for="dashboard-search">بحث شامل في المنصة</label><i class="bi bi-search"></i><input id="dashboard-search" name="q" value="{{ request.GET.q }}" minlength="2" placeholder="بحث شامل في المنصة..." autocomplete="off"></form><div class="header-actions"><span class="notif"><i class="bi bi-bell"></i>{% if unread_notifications %}<b>{{ unread_notifications }}</b>{% endif %}</span><div class="user-pill"><i class="bi bi-person-circle"></i><span>{{ request.user.get_full_name|default:request.user.username }}</span></div><a class="btn btn-outline-danger btn-sm" href="{% url 'accounts:logout' %}">تسجيل الخروج</a></div></header>
